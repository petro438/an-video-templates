<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACTION · Template Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--surface-background, #ebecf0);
      color: var(--text-icons-primary, #1d1d25);
      font-family: 'Mona Sans', 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-foreground); }
    ::-webkit-scrollbar-thumb { background: var(--dividers-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-icons-tertiary); }
    input:focus, textarea:focus, select:focus {
      border-color: var(--buttons-primary-green) !important;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
